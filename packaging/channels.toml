# Code++ release channels — single source of truth for CI and local scripts.
# Three independent channels share workspace version (Cargo.toml [workspace.package].version).

[channels.cli]
# cargo-dist: cross-platform CLI archives + shell/powershell installers.
enabled = false
tool = "cargo-dist"
package = "code-plus-plus-cli"
binary = "code-plus-plus"
# Targets to build when enabled (Rust triple syntax):
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[channels.desktop]
# GPUI desktop application — platform-specific installers.
enabled = true
package = "code-plus-plus-desktop"
# Must match the [[bin]] name in crates/code-plus-plus-desktop/Cargo.toml
# (renamed from `code-plus-plus` to avoid overwriting the CLI binary).
binary = "code-plus-plus-desktop"

[[channels.desktop.platforms]]
id = "windows-x64"
enabled = true
rust_target = "x86_64-pc-windows-msvc"
runner = "windows-latest"
installer = "nsis"

[[channels.desktop.platforms]]
id = "macos-x64"
enabled = false
rust_target = "x86_64-apple-darwin"
runner = "macos-latest"
installer = "dmg"

[[channels.desktop.platforms]]
id = "macos-arm64"
enabled = false
rust_target = "aarch64-apple-darwin"
runner = "macos-latest"
installer = "dmg"

[[channels.desktop.platforms]]
id = "linux-x64"
enabled = false
rust_target = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
installer = "deb"

[channels.crates]
# release-plz: publish library crates to crates.io (binary crates stay publish=false).
# Enablement checklist: set enabled=true, ensure every package below has a
# crates.io-ready manifest (description/license/repository), then run release-plz.
enabled = false
tool = "release-plz"
packages = [
    "code-plus-plus-types",
    "code-plus-plus-schema",
    "code-plus-plus-config",
    "code-plus-plus-telemetry",
    "code-plus-plus-storage",
    "code-plus-plus-llm",
    "code-plus-plus-core",
    "code-plus-plus-plugin",
    "code-plus-plus-embed",
    "code-plus-plus-server",
    "code-plus-plus-sdk",
]

[signing]
# minisign ed25519 — private key in signing/ (gitignored), public key committed for verification.
private_key_path = "signing/code-plus-plus.key"
public_key_path = "signing/code-plus-plus.key.pub"
# Optional Authenticode for Windows installer trust (PFX base64 in CI secret).
authenticode_secret = "CODE_PLUS_PLUS_WINDOWS_PFX_BASE64"
authenticode_password_secret = "CODE_PLUS_PLUS_WINDOWS_PFX_PASSWORD"
