[workspace]
resolver = "2"
members = [
    "crates/deepseekcode-types",
    "crates/deepseekcode-schema",
    "crates/deepseekcode-config",
    "crates/deepseekcode-telemetry",
    "crates/deepseekcode-storage",
    "crates/deepseekcode-llm",
    "crates/deepseekcode-core",
    "crates/deepseekcode-plugin",
    "crates/deepseekcode-server",
    "crates/deepseekcode-sdk",
    "crates/deepseekcode-cli",
    "crates/deepseekcode-desktop",
    "examples/plugins/hello-hook",
]
# P1-9: bare `cargo build/test` covers everything except the desktop shell
# (previously CLI-only, masking server/SDK breakage). Desktop is excluded
# because it depends on a git `gpui` revision (network); build it explicitly
# via `cargo build -p deepseekcode-desktop`.
default-members = [
    "crates/deepseekcode-types",
    "crates/deepseekcode-schema",
    "crates/deepseekcode-config",
    "crates/deepseekcode-telemetry",
    "crates/deepseekcode-storage",
    "crates/deepseekcode-llm",
    "crates/deepseekcode-core",
    "crates/deepseekcode-plugin",
    "crates/deepseekcode-server",
    "crates/deepseekcode-sdk",
    "crates/deepseekcode-cli",
    "examples/plugins/hello-hook",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/deepseekcode/deepseekcode"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
deepseekcode-types = { path = "crates/deepseekcode-types" }
deepseekcode-schema = { path = "crates/deepseekcode-schema" }
deepseekcode-config = { path = "crates/deepseekcode-config" }
deepseekcode-telemetry = { path = "crates/deepseekcode-telemetry" }
deepseekcode-storage = { path = "crates/deepseekcode-storage" }
deepseekcode-llm = { path = "crates/deepseekcode-llm" }
deepseekcode-core = { path = "crates/deepseekcode-core" }
deepseekcode-plugin = { path = "crates/deepseekcode-plugin" }
deepseekcode-server = { path = "crates/deepseekcode-server" }
deepseekcode-sdk = { path = "crates/deepseekcode-sdk" }
deepseekcode-desktop = { path = "crates/deepseekcode-desktop" }

# Async runtime — trimmed from `full` for a lighter workspace footprint
tokio = { version = "1.44", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonc-parser = { version = "0.27", features = ["serde"] }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# P1-9: `blocking` removed (deadlocks when misused inside async; no caller
# may use blocking client). `socks`/`http2`/`system-proxy` kept for VPN support.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "socks", "http2", "system-proxy"], default-features = false }
eventsource-stream = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
refinery = { version = "0.8" }
tokio-stream = { version = "0.1", features = ["sync"] }
# Pinned-IP transport stack (DeepSeek VPN fallback only) — workspace-pinned so
# `deepseekcode-llm` cannot drift from the reqwest TLS stack independently.
hyper = { version = "1.10" }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "webpki-tokio", "native-tokio", "ring"] }
http = { version = "1.4" }
http-body-util = { version = "0.1" }
bytes = { version = "1.12" }
tower-service = { version = "0.3" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0" }
rustls-native-certs = { version = "0.8" }

# IDs & time
ulid = { version = "1.2", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Schema / OpenAPI
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
utoipa = { version = "5.3", features = ["chrono", "uuid"] }

# Filesystem
glob = "0.3"
ignore = "0.4"
walkdir = "2.5"
similar = "2.7"
camino = { version = "1.1", features = ["serde1"] }

# PTY
portable-pty = "0.8"
alacritty_terminal = "0.26"

# Crypto / credentials
keyring = "3.6"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

# Markdown
pulldown-cmark = "0.13"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Plugin WASM
wasmtime = "29.0"

# Native plugins
libloading = "0.8"

# Testing
tempfile = "3.19"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1

# P1-9: `[profile.dist]` removed — it contradicted
# `[workspace.metadata.dist] dist = false` below (cargo-dist disabled for this
# workspace; releases go through packaging/channels.toml + release-plz).
# Keeping both suggested dist builds work; they do not.

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
debug = 0

[workspace.metadata.dist]
# Channel A (CLI) — see dist-workspace.toml and packaging/channels.toml
dist = false
