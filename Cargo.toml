[workspace]
resolver = "2"
members = [
    "crates/code-plus-plus-types",
    "crates/code-plus-plus-schema",
    "crates/code-plus-plus-config",
    "crates/code-plus-plus-i18n",
    "crates/code-plus-plus-telemetry",
    "crates/code-plus-plus-storage",
    "crates/code-plus-plus-llm",
    "crates/code-plus-plus-core",
    "crates/code-plus-plus-plugin",
    "crates/code-plus-plus-embed",
    "crates/code-plus-plus-server",
    "crates/code-plus-plus-sdk",
    "crates/code-plus-plus-cli",
    "crates/code-plus-plus-desktop",
    "examples/plugins/hello-hook",
]
# P1-9: bare `cargo build/test` covers everything except the desktop shell
# (previously CLI-only, masking server/SDK breakage). Desktop is excluded
# because it depends on a git `gpui` revision (network); build it explicitly
# via `cargo build -p code-plus-plus-desktop`.
default-members = [
    "crates/code-plus-plus-types",
    "crates/code-plus-plus-schema",
    "crates/code-plus-plus-config",
    "crates/code-plus-plus-i18n",
    "crates/code-plus-plus-telemetry",
    "crates/code-plus-plus-storage",
    "crates/code-plus-plus-llm",
    "crates/code-plus-plus-core",
    "crates/code-plus-plus-plugin",
    "crates/code-plus-plus-embed",
    "crates/code-plus-plus-server",
    "crates/code-plus-plus-sdk",
    "crates/code-plus-plus-cli",
    "examples/plugins/hello-hook",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xtc002007/code-plus-plus"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
code-plus-plus-types = { path = "crates/code-plus-plus-types" }
code-plus-plus-schema = { path = "crates/code-plus-plus-schema" }
code-plus-plus-config = { path = "crates/code-plus-plus-config" }
code-plus-plus-i18n = { path = "crates/code-plus-plus-i18n" }
code-plus-plus-telemetry = { path = "crates/code-plus-plus-telemetry" }
code-plus-plus-storage = { path = "crates/code-plus-plus-storage" }
code-plus-plus-llm = { path = "crates/code-plus-plus-llm" }
# NOTE: per-edge `default-features = false` does NOT work combined with
# `{ workspace = true }` inheritance (cargo ignores it with a warning, and
# enabling any `wasm-plugins` feature then leaks wasmtime into slim builds).
# Slim edges therefore spell out full `path` dependencies instead of
# inheriting these five entries; do not "simplify" them back.
code-plus-plus-core = { path = "crates/code-plus-plus-core" }
code-plus-plus-plugin = { path = "crates/code-plus-plus-plugin" }
code-plus-plus-embed = { path = "crates/code-plus-plus-embed" }
code-plus-plus-server = { path = "crates/code-plus-plus-server" }
code-plus-plus-sdk = { path = "crates/code-plus-plus-sdk" }
code-plus-plus-desktop = { path = "crates/code-plus-plus-desktop" }

# Async runtime — trimmed from `full` for a lighter workspace footprint
tokio = { version = "1.44", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonc-parser = { version = "0.27", features = ["serde"] }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
# Single WebSocket stack: axum 0.8.9 uses tokio-tungstenite 0.29; workspace
# pins 0.29 so desktop PTY compiles a single stack (previously 0.26+0.29 dual).
tokio-tungstenite = { version = "0.29" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# P1-9: `blocking` removed (deadlocks when misused inside async; no caller
# may use blocking client). `socks`/`http2`/`system-proxy` kept for VPN support.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "socks", "http2", "system-proxy"], default-features = false }
eventsource-stream = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
refinery = { version = "0.8" }
tokio-stream = { version = "0.1", features = ["sync"] }
# Pinned-IP transport stack (DeepSeek VPN fallback only) — workspace-pinned so
# `code-plus-plus-llm` cannot drift from the reqwest TLS stack independently.
hyper = { version = "1.10" }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "webpki-tokio", "native-tokio", "ring"] }
http = { version = "1.4" }
http-body-util = { version = "0.1" }
bytes = { version = "1.12" }
tower-service = { version = "0.3" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0" }
rustls-native-certs = { version = "0.8" }

# OS standard directories (maintained; replaces unmaintained `dirs`).
directories = "6.0"

# IDs & time
ulid = { version = "1.2", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Schema / OpenAPI
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
utoipa = { version = "5.3", features = ["chrono", "uuid"] }

# Filesystem
glob = "0.3"
ignore = "0.4"
walkdir = "2.5"
similar = "2.7"
camino = { version = "1.1", features = ["serde1"] }

# PTY
portable-pty = "0.8"
alacritty_terminal = "0.26"

# Crypto / credentials
keyring = "3.6"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

# Windows console output arrives in the OEM/ANSI code page (GBK on zh-CN
# systems), not UTF-8. Needed to decode it instead of dropping the stream.
encoding_rs = { version = "0.8.35", features = ["alloc"] }

# Markdown
pulldown-cmark = "0.13"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Plugin WASM
wasmtime = "29.0"

# Native plugins
libloading = "0.8"

# Testing
tempfile = "3.19"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1

# P1-9: `[profile.dist]` removed — it contradicted
# `[workspace.metadata.dist] dist = false` below (cargo-dist disabled for this
# workspace; releases go through packaging/channels.toml + release-plz).
# Keeping both suggested dist builds work; they do not.

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
debug = 0

[workspace.metadata.dist]
# Channel A (CLI) — see dist-workspace.toml and packaging/channels.toml
dist = false
