name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  RUST_BACKTRACE: 1

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build native plugin example
        run: cargo build -p hello-hook --release
      - name: Test core crates
        run: |
          $env:DEEPSEEKCODE_LOG_CONSOLE = "0"
          $env:DEEPSEEKCODE_LOG_LEVEL = "debug"
          $env:DEEPSEEKCODE_DISABLE_KEYRING = "1"
          cargo test -p deepseekcode-types -p deepseekcode-schema -p deepseekcode-config -p deepseekcode-i18n -p deepseekcode-storage -p deepseekcode-llm -p deepseekcode-core -p deepseekcode-plugin -p deepseekcode-telemetry
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Path "$env:LOCALAPPDATA\deepseekcode\logs" -Recurse -Filter app.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            exit $LASTEXITCODE
          }
          cargo test -p deepseekcode-server -p deepseekcode-sdk -p deepseekcode-cli
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Path "$env:LOCALAPPDATA\deepseekcode\logs" -Recurse -Filter app.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            exit $LASTEXITCODE
          }
          cargo test -p deepseekcode-server --test openapi_contract
      - name: i18n catalog parity (all ten locales)
        run: cargo test -p deepseekcode-i18n --test catalog_parity
      - name: Test desktop (logic)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo test -p deepseekcode-desktop
      - name: Check desktop
        run: cargo check -p deepseekcode-desktop
      - name: Cache impact guard (DeepSeek prefix)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: ./scripts/check-cache-impact.ps1 -Mode cold
      - name: Bench smoke (startup)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo bench -p deepseekcode-sdk --bench startup -- --nocapture
      - name: Bench smoke (sse_latency)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo bench -p deepseekcode-sdk --bench sse_latency -- --nocapture
      - name: Bench smoke (memory)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo bench -p deepseekcode-sdk --bench memory -- --nocapture
      - name: Bench smoke (file_tree)
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo bench -p deepseekcode-sdk --bench file_tree -- --nocapture
  # P1-13: linux/macOS portability gate (rfd/keyring/portable-pty breakage).
  test-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace (excl. desktop git-dep)
        run: cargo check --workspace --exclude deepseekcode-desktop
      - name: Test portable crates
        env:
          DEEPSEEKCODE_DISABLE_KEYRING: "1"
        run: cargo test -p deepseekcode-types -p deepseekcode-schema -p deepseekcode-config -p deepseekcode-i18n -p deepseekcode-storage -p deepseekcode-llm -p deepseekcode-core
  # B7: MSRV gate — workspace declares rust-version = "1.85"; this job fails
  # if any dependency or language feature breaks the 1.85 floor (CI otherwise
  # runs latest stable, currently 1.97, which would silently mask MSRV drift).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV floor (excl. desktop git-dep)
        run: cargo check --workspace --exclude deepseekcode-desktop
  # C1: dependency vulnerability gate (reads Cargo.lock).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
