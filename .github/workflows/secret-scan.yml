name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      # Parity with the local pre-commit path: the repo's own scanner
      # (self-bootstrapping .tools/, same .gitleaks.toml) must agree with CI.
      # Previously CI used only the action while local hooks used this script.
      - name: Run repo secret scanner (Windows/powerShell)
        shell: pwsh
        run: ./scripts/release/scan-secrets.ps1
