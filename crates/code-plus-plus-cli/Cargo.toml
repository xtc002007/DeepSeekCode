[package]
name = "code-plus-plus-cli"
description = "Command-line interface for Code++"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Binary-only crate: distributed via cargo-dist/NSIS channels, never crates.io.
publish = false

[[bin]]
name = "code-plus-plus"
path = "src/main.rs"

# Slim native-only binary without the wasmtime stack:
# `cargo build -p code-plus-plus-cli --no-default-features`
[features]
default = ["wasm-plugins"]
wasm-plugins = [
    "code-plus-plus-core/wasm-plugins",
    "code-plus-plus-sdk/wasm-plugins",
    "code-plus-plus-server/wasm-plugins",
]

[dependencies]
code-plus-plus-types = { workspace = true }
code-plus-plus-schema = { workspace = true }
code-plus-plus-core = { path = "../code-plus-plus-core", default-features = false }
code-plus-plus-config = { workspace = true }
code-plus-plus-i18n = { workspace = true }
code-plus-plus-telemetry = { workspace = true }
code-plus-plus-sdk = { path = "../code-plus-plus-sdk", default-features = false }
code-plus-plus-llm = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
camino = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
code-plus-plus-server = { path = "../code-plus-plus-server", default-features = false }
