[package]
name = "deepseekcode-embed"
description = "In-process HTTP engine (Axum router, SSE, PTY) shared by the SDK, desktop, and serve command"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wasm-plugins"]
wasm-plugins = ["deepseekcode-core/wasm-plugins"]

[dependencies]
deepseekcode-types = { workspace = true }
deepseekcode-schema = { workspace = true }
deepseekcode-config = { workspace = true }
deepseekcode-core = { path = "../deepseekcode-core", default-features = false }
deepseekcode-llm = { workspace = true }
deepseekcode-storage = { workspace = true }
deepseekcode-telemetry = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
ignore = { workspace = true }
portable-pty = { workspace = true }
chrono = { workspace = true }
camino = { workspace = true }
similar = { workspace = true }
tokio-stream = { workspace = true }
base64 = { workspace = true }
ulid = { workspace = true }
jsonc-parser = { workspace = true }

[dev-dependencies]
deepseekcode-core = { workspace = true }
deepseekcode-config = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
futures = { workspace = true }
deepseekcode-schema = { workspace = true }
