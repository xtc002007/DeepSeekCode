[package]
name = "deepseekcode-llm"
description = "LLM protocol layer with four-axis routing for DeepSeekCode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deepseekcode-types = { workspace = true }
deepseekcode-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
deepseekcode-telemetry = { workspace = true }
# SNI-preserving pinned-IP transport (VPN TUN fake-DNS fallback):
# TCP dials DoH-resolved real IPs while TLS SNI keeps the API hostname.
# NOTE: hyper-rustls uses `ring` (not default `aws-lc-rs`) to match the
# already-compiled reqwest TLS stack — avoids new native builds/downloads.
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tower-service = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-native-certs = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
