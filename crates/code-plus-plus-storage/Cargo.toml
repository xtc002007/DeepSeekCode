[package]
name = "code-plus-plus-storage"
description = "SQLite persistence and event store for Code++"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Containers/CI without D-Bus/Keychain/macOS keychain build with
# `--no-default-features` (falls back to encrypted SQLite only).
[features]
default = ["os-keychain"]
os-keychain = ["dep:keyring"]

[dependencies]
code-plus-plus-types = { workspace = true }
code-plus-plus-schema = { workspace = true }
sqlx = { workspace = true }
refinery = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
code-plus-plus-telemetry = { workspace = true }
camino = { workspace = true }
keyring = { workspace = true, optional = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
getrandom = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
