[package]
name = "deepseekcode-desktop"
description = "DeepSeekCode desktop application built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# P1-12: distinct binary name so `target/release/deepseekcode(.exe)` (CLI)
# and the desktop never overwrite each other; installer grabs
# `deepseekcode-desktop(.exe)` explicitly.
[[bin]]
name = "deepseekcode-desktop"
path = "src/main.rs"

[lib]
name = "deepseekcode_desktop"
path = "src/lib.rs"

[features]
default = ["os-keychain"]
os-keychain = ["dep:keyring"]

# P1-12: windows-only build deps must not compile on linux/macOS.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
image = "0.25"
ico = "0.3"

[dependencies]
deepseekcode-types = { workspace = true }
deepseekcode-schema = { workspace = true }
deepseekcode-config = { workspace = true }
deepseekcode-i18n = { workspace = true }
deepseekcode-telemetry = { workspace = true }
deepseekcode-sdk = { workspace = true }
deepseekcode-core = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
camino = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
similar = { workspace = true }
# GPUI vendor note: `gpui`/`gpui_platform` are not on crates.io — they are
# pinned to a reviewed `zed-industries/zed` git rev (57261fef…). Bumping the
# rev requires re-running `cargo check -p deepseekcode-desktop` on
# Windows + macOS, re-recording the rev in THIRD_PARTY_NOTICES.md, and
# confirming `cargo tree -p deepseekcode-desktop` pulls no new duplicate
# transitive deps. No `[patch]`/vendor dir: the git rev is the single source
# of truth and Cargo's git cache handles offline rebuilds.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "57261fef89db4ba6767617e74324c682754ff3f4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "57261fef89db4ba6767617e74324c682754ff3f4" }
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
eventsource-stream = { workspace = true }
rfd = "0.15"
image = "0.25"
tokio-tungstenite = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
ulid = { workspace = true }
unicode-segmentation = "1.12"
pulldown-cmark = { workspace = true }
keyring = { workspace = true, optional = true }
tempfile = { workspace = true }
ropey = "1.6"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
alacritty_terminal = { workspace = true }
streaming-iterator = "0.1"
