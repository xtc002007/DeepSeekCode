[package]
name = "deepseekcode-core"
description = "Core domain logic: session engine, tools, agents, system context"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Slim builds without the wasmtime stack (native plugins only):
# `cargo build -p deepseekcode-cli --no-default-features` drops ~100MB of
# compile. Core itself never names wasmtime types, so no `cfg` code is needed
# here �?the flag forwards to `deepseekcode-plugin/wasm`.
[features]
default = ["wasm-plugins"]
wasm-plugins = ["deepseekcode-plugin/wasm"]

[dependencies]
deepseekcode-types = { workspace = true }
deepseekcode-schema = { workspace = true }
deepseekcode-config = { workspace = true }
deepseekcode-telemetry = { workspace = true }
deepseekcode-storage = { workspace = true }
deepseekcode-llm = { workspace = true }
# Full path spec (not workspace-inherited): per-edge default-features is
# ignored on inherited edges. See workspace Cargo.toml note.
deepseekcode-plugin = { path = "../deepseekcode-plugin", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
camino = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
ulid = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
encoding_rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = { workspace = true }
futures = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }
