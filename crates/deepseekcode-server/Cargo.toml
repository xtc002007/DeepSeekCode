[package]
name = "deepseekcode-server"
description = "Standalone-server facade over deepseekcode-embed for the serve command"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wasm-plugins"]
wasm-plugins = ["deepseekcode-embed/wasm-plugins"]

[dependencies]
deepseekcode-embed = { path = "../deepseekcode-embed", default-features = false }
# Kept so downstream `serve`-adjacent code keeps compiling without churn;
# the engine itself contributes no new symbols beyond the re-export.
deepseekcode-types = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
deepseekcode-core = { workspace = true }
deepseekcode-config = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
futures = { workspace = true }
deepseekcode-schema = { workspace = true }
# Integration tests boot the router directly and touch storage/camino.
axum = { workspace = true }
tokio = { workspace = true }
deepseekcode-storage = { workspace = true }
camino = { workspace = true }
