[package]
name = "deepseekcode-sdk"
description = "High-level Rust SDK and embedded engine for DeepSeekCode"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wasm-plugins"]
wasm-plugins = ["deepseekcode-core/wasm-plugins", "deepseekcode-embed/wasm-plugins"]

[dependencies]
deepseekcode-types = { workspace = true }
deepseekcode-schema = { workspace = true }
deepseekcode-config = { workspace = true }
deepseekcode-core = { path = "../deepseekcode-core", default-features = false }
deepseekcode-embed = { path = "../deepseekcode-embed", default-features = false }
deepseekcode-storage = { workspace = true }
deepseekcode-llm = { workspace = true }
urlencoding = "2"
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
eventsource-stream = { workspace = true }
tracing = { workspace = true }
deepseekcode-telemetry = { workspace = true }
camino = { workspace = true }

# Standard layout (`benches/` next to `src/`): `cargo package` and tooling
# resolve these without out-of-tree `../../` paths (which previously broke
# packaging and confused `cargo bench` from the workspace root).
[[bench]]
name = "startup"
harness = false

[[bench]]
name = "file_tree"
harness = false

[[bench]]
name = "sse_latency"
harness = false

[[bench]]
name = "memory"
harness = false

[dev-dependencies]
tempfile = { workspace = true }
ignore = { workspace = true }
deepseekcode-schema = { workspace = true }
