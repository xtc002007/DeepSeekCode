title = "Code++ gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives"
paths = [
  '''(?i)code-plus-plus-telemetry/src/redact\.rs''',
  '''(?i)credentials_store\.rs''',
  '''(?i)integration_test\.rs''',
  '''(?i)\.env\.example''',
  '''(?i)code-plus-plus\.jsonc\.example''',
  '''(?i)SECURITY\.md''',
  '''(?i)docs/packaging\.md''',
  '''(?i)signing/README\.md''',
]
regexes = [
  '''sk-test-secret''',
  '''sk-persist-me''',
  '''sk-\[REDACTED\]''',
  '''test-key''',
  '''YOUR_API_KEY_HERE''',
  '''your-key''',
  '''your-org/code-plus-plus''',
  '''your-password-or-empty''',
]
